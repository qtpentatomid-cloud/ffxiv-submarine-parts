<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--bg:#eef3f4;--surface:#fff;--ink:#14272e;--sub:#5b6f76;--line:#cfdadd;--acc:#1f6f80;--warn:#b4430c;--ok:#2d7a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1e;--surface:#16262c;--ink:#e6eef0;--sub:#9fb4ba;--line:#2a4048;--acc:#5cc1d4;--warn:#f0905a;--ok:#6cc896}}
:root[data-theme="dark"]{--bg:#0f1a1e;--surface:#16262c;--ink:#e6eef0;--sub:#9fb4ba;--line:#2a4048;--acc:#5cc1d4;--warn:#f0905a;--ok:#6cc896}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.35rem;margin:0 0 4px}
.note{color:var(--sub);font-size:.88rem;margin:0 0 16px}
.sel{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sel label{display:flex;gap:6px;align-items:center;font-weight:700}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--acc);border-radius:999px;padding:3px 6px 3px 12px;font-size:.88rem}
.chip button{padding:0 8px;border-radius:999px;line-height:1.6}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.sum{background:var(--surface);border:2px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:20px}
.sum h2{font-size:1rem;margin:0 0 6px;color:var(--acc)}
.sum h2.mkh{margin-top:12px;color:var(--ok)}
.sum p{margin:2px 0;font-size:.92rem}
.sum.el{border:1px solid var(--line)}
.sum.el h2{color:var(--sub);font-size:.95rem}
.el table{border-collapse:collapse;font-size:.88rem;width:100%}
.el th,.el td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line)}
.el th:first-child,.el td:first-child{text-align:left}
.el th{color:var(--sub);font-weight:400}
.el td.dt{color:var(--sub);font-size:.78rem;text-align:left;padding-top:0}
section{margin-bottom:22px}
section h2{font-size:1.05rem;margin:0 0 8px;padding-left:10px;border-left:4px solid var(--acc)}
.row{display:grid;grid-template-columns:1fr 64px 78px 112px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.row.head{background:none;border:0;padding:0 10px;color:var(--sub);font-size:.78rem}
.nm{font-weight:700;font-size:.95rem}
.nm.has{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
#tip{position:fixed;z-index:20;max-width:280px;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:.82rem;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;pointer-events:none}
input{width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-align:right}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.need{text-align:right}
.short{text-align:right;font-weight:700}
.short.n{color:var(--warn)}
.short.z{color:var(--ok);font-weight:400;font-size:.85rem}
.short small{display:block;font-weight:400;font-size:.72rem;color:var(--sub)}
.short small.mk{color:var(--ok);font-weight:700}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
@media (max-width:480px){.row{grid-template-columns:1fr 52px 64px 100px;gap:6px;padding:8px}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const KINDS=[['d','納品素材'],['m','中間素材'],['r','末端素材']];
// 素材一覧に出さず、補足として必要数だけ表示する属性素材
const ELEM=/^(ファイア|アイス|ウィンド|ウォーター|ライトニング|アース)(シャード|クリスタル|クラスター)$/;
const isEl=n=>ELEM.test(n);
function term(s){const m=s.trim().match(/^(.+?)\s*[×x]\s*(\d+)$/);return m?[m[1].trim(),+m[2]]:null}
// 素材メモ
const NOTE={};
$('d-note').textContent.split('\n').forEach(l=>{const i=l.search(/[：:]/);if(i<1)return;const k=l.slice(0,i).trim(),v=l.slice(i+1).trim();if(k&&v)NOTE[k]=v.split('／').map(s=>s.trim()).filter(Boolean)});
// 交換に必要なもの（素材メモの「軍票200枚」「詩学5」などから自動で読み取り）
const CUR_NAMES=['軍票','詩学','クラフタースクリップ','ギャザラースクリップ'];
const CUR_UNIT={'軍票':'枚','詩学':'','クラフタースクリップ':'個','ギャザラースクリップ':'個'};
const COST={};
Object.entries(NOTE).forEach(([k,ls])=>{const m=ls.join(' ').match(/(軍票|詩学|クラフタースクリップ|ギャザラースクリップ)\s*(\d+)/);if(m)COST[k]={cur:m[1],n:+m[2]}});
// レシピ
const REC={};
$('d-rec').textContent.split('\n').forEach(l=>{const p=l.split(/[：:]/);if(p.length<2)return;const o=term(p[0]);if(!o)return;
const ins=p.slice(1).join(':').split(/[、,]/).map(term).filter(Boolean);if(ins.length)REC[o[0]]={yield:o[1],inputs:ins}});
// パーツ
const PARTS=[];let cur,stg=0;
$('d-parts').textContent.split('\n').forEach(l=>{l=l.trim();if(!l)return;
const m=l.match(/^工程[：:]\s*(\d+)/);if(m){stg=+m[1];return}
const t=term(l);if(t){if(cur)cur.items.push({stage:stg,name:t[0],qty:t[1]});return}
cur={name:l,items:[]};PARTS.push(cur);stg=0});
// パーツ名を「級」と「艦体・艦尾・艦首・艦橋」に分ける
const TYPES=['艦体','艦尾','艦首','艦橋'];
// 「級」の並び順（ここに書いていない級は、最後に追加順で並びます）
const CLASS_ORDER=['シャーク級','ウンキウ級','シーラカンス級','シルドラ級','ホエール級'];
PARTS.forEach(p=>{const m=p.name.match(/(艦体|艦尾|艦首|艦橋)$/);p.type=m?m[1]:'';p.cls=m?p.name.slice(0,m.index):p.name});
const ALLCLS=[...new Set(PARTS.map(p=>p.cls))];
const CLASSES=[...CLASS_ORDER.filter(c=>ALLCLS.includes(c)),...ALLCLS.filter(c=>!CLASS_ORDER.includes(c))];
// 素材名の一覧と、使う側から先に処理する順序
const NAMES=new Set();
Object.entries(REC).forEach(([k,r])=>{NAMES.add(k);r.inputs.forEach(([c])=>NAMES.add(c))});
PARTS.forEach(p=>p.items.forEach(i=>NAMES.add(i.name)));
const IDX={};[...NAMES].forEach((n,i)=>IDX[n]=i);
const ORDER=(()=>{const d={};NAMES.forEach(n=>d[n]=0);
Object.values(REC).forEach(r=>r.inputs.forEach(([c])=>d[c]++));
const q=[...NAMES].filter(n=>!d[n]),o=[];
while(q.length){const n=q.shift();o.push(n);(REC[n]?REC[n].inputs:[]).forEach(([c])=>{if(--d[c]===0)q.push(c)})}
return o})();
// 状態の保存
const KEY='fc-subs-v2';
let state={part:PARTS[0].name,stage:'all',stock:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)state=Object.assign(state,s)}catch(e){}
if(!PARTS.some(p=>p.name===state.part))state.part=PARTS[0].name;
state.stock=state.stock||{};
if(!Array.isArray(state.plan))state.plan=[{part:state.part,stage:state.stage}];
state.plan=state.plan.filter(e=>PARTS.some(p=>p.name===e.part));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function curPart(){return PARTS.find(p=>p.name===state.part)}
function deliveries(){const d={};state.plan.forEach(e=>{const p=PARTS.find(x=>x.name===e.part);if(!p)return;p.items.forEach(i=>{if(e.stage==='all'||+e.stage===i.stage)d[i.name]=(d[i.name]||0)+i.qty})});return d}
// 不足の計算と、今の手持ちで作れる数の計算
function calc(){
const dl=deliveries(),need={},res={};NAMES.forEach(n=>need[n]=dl[n]||0);
ORDER.forEach(n=>{const r=REC[n],have=state.stock[n]||0,short=Math.max(0,need[n]-have);let crafts=0;
if(r){crafts=Math.ceil(short/r.yield);r.inputs.forEach(([c,q])=>need[c]+=crafts*q)}
res[n]={need:need[n],short,crafts,now:0}});
const rem={};NAMES.forEach(n=>rem[n]=Math.min(res[n].need,state.stock[n]||0));
[...ORDER].reverse().forEach(n=>{const r=REC[n],x=res[n];
if(r&&x.crafts>0){const ins=r.inputs.filter(([c])=>!isEl(c));let t=x.crafts;ins.forEach(([c,q])=>{t=Math.min(t,Math.floor(rem[c]/q))});
ins.forEach(([c,q])=>rem[c]-=t*q);x.now=Math.min(x.short,t*r.yield);rem[n]+=x.now}});
return{res,dl}}
let VIS=[],DL={};
const kind=n=>DL[n]>0?'d':REC[n]?'m':'r';
function build(){
DL=deliveries();
const reach=new Set(),st=Object.keys(DL);
while(st.length){const n=st.pop();if(reach.has(n))continue;reach.add(n);(REC[n]?REC[n].inputs:[]).forEach(([c])=>st.push(c))}
VIS=ORDER.filter(n=>reach.has(n)&&!isEl(n));
$('list').innerHTML=KINDS.map(([k,label])=>{const rows=VIS.filter(n=>kind(n)===k);if(!rows.length)return'';
return '<section><h2>'+label+'</h2><div class="row head"><span>素材</span><span class="need">必要数</span><span class="need">手持ち</span><span class="short">不足</span></div>'+
rows.map(n=>'<div class="row"><span class="nm'+(NOTE[n]?' has" tabindex="0" data-tip="'+n:'')+'">'+n+'</span><span class="need" id="n-'+IDX[n]+'"></span><input type="number" min="0" inputmode="numeric" data-stock="'+n+'" aria-label="'+n+'の手持ち" value="'+(state.stock[n]||'')+'"><span class="short" id="s-'+IDX[n]+'"></span></div>').join('')+'</section>'}).join('');
update()}
const ELS=['ファイア','アイス','ウィンド','ウォーター','ライトニング','アース'],ELT=['シャード','クリスタル','クラスター'];
function renderEl(r){
const nd=(e,t)=>(r[e+t]||{need:0}).need;
const rows=ELS.filter(e=>ELT.some(t=>nd(e,t)>0));
$('el').innerHTML='<h2>補足：属性素材の必要数</h2>'+(rows.length?'<table><tr><th></th>'+ELT.map(t=>'<th>'+t+'</th>').join('')+'</tr>'+rows.map(e=>'<tr><td>'+e+'</td>'+ELT.map(t=>'<td>'+(nd(e,t)||'-')+'</td>').join('')+'</tr>').join('')+'</table><p class="note" style="margin:6px 0 0">手持ちの素材で作れる分を引いた、これから作る分に必要な数です。</p>':'<p>必要な属性素材はありません。</p>')}
function renderCur(r){
const tot={},det={};
VIS.forEach(n=>{const c=COST[n];if(!c||REC[n])return;const k=r[n].short;if(k<=0)return;
tot[c.cur]=(tot[c.cur]||0)+k*c.n;(det[c.cur]=det[c.cur]||[]).push(n+' '+k+'個×'+c.n)});
const cs=CUR_NAMES.filter(c=>tot[c]);
$('cur').innerHTML='<h2>補足：交換に必要なもの</h2>'+(cs.length?'<table>'+cs.map(c=>'<tr><td>'+c+'</td><td>'+tot[c].toLocaleString()+CUR_UNIT[c]+'</td></tr><tr><td colspan="2" class="dt">'+esc(det[c].join('、'))+'</td></tr>').join('')+'</table><p class="note" style="margin:6px 0 0">手持ちを引いたあとの不足分に必要な数です。内訳は「素材名 不足個数×1個あたりの交換数」です。</p>':'<p>交換に必要なものはありません。</p>')}
function update(){
const r=calc().res;renderEl(r);renderCur(r);
VIS.forEach(n=>{const x=r[n],i=IDX[n],s=$('s-'+i);$('n-'+i).textContent=x.need;
if(x.short===0){s.className='short z';s.textContent='足りています'}
else{s.className='short n';s.innerHTML=x.short+'個'+(REC[n]?'<small>製作'+x.crafts+'回</small>'+(x.now>=x.short?'<small class="mk">全部作れます</small>':x.now>0?'<small class="mk">今作れる '+x.now+'個</small>':''):'')}});
const lines=KINDS.map(([k,label])=>{const p=VIS.filter(n=>kind(n)===k&&r[n].short>0).map(n=>n+' '+r[n].short+'個');
return p.length?'<p><b>'+label+'</b>：'+p.join('、')+'</p>':''}).join('');
const mk=[...ORDER].reverse().filter(n=>VIS.includes(n)&&r[n].now>0).map(n=>'<p>'+n+' '+r[n].now+'個'+(r[n].now>=r[n].short?'（不足ぶんすべて）':'')+'</p>').join('');
$('sum').innerHTML='<h2>不足まとめ</h2>'+(lines||(state.plan.length?'<p>不足はありません。</p>':'<p>パーツを追加してください。</p>'))+(mk?'<h2 class="mkh">いま手持ちの素材で作れるもの（上から順に製作）</h2>'+mk:'')}
function stageOpts(){
const ss=[...new Set(curPart().items.map(i=>i.stage))].sort((a,b)=>a-b);
$('stage').innerHTML='<option value="all">全工程</option>'+ss.map(s=>'<option value="'+s+'">工程'+s+'</option>').join('');
if(state.stage!=='all'&&!ss.includes(+state.stage))state.stage='all';
$('stage').value=state.stage}
function typesOf(c){const ts=PARTS.filter(p=>p.cls===c).map(p=>p.type);return [...TYPES.filter(t=>ts.includes(t)),...ts.filter(t=>!TYPES.includes(t))]}
function typeOpts(){$('ptype').innerHTML=typesOf($('cls').value).map(t=>'<option value="'+t+'">'+(t||'（なし）')+'</option>').join('')}
function pick(c,t){const p=PARTS.find(x=>x.cls===c&&x.type===t)||PARTS.find(x=>x.cls===c);state.part=p.name;state.stage='all'}
$('cls').innerHTML=CLASSES.map(c=>'<option>'+c+'</option>').join('');
$('cls').value=curPart().cls;typeOpts();$('ptype').value=curPart().type;
$('cls').addEventListener('change',e=>{const old=curPart().type;typeOpts();const ts=typesOf(e.target.value),t=ts.includes(old)?old:ts[0];$('ptype').value=t;pick(e.target.value,t);stageOpts();save()});
$('ptype').addEventListener('change',e=>{pick($('cls').value,e.target.value);stageOpts();save()});
$('stage').addEventListener('change',e=>{state.stage=e.target.value;save()});
$('list').addEventListener('input',e=>{const n=e.target.dataset.stock;if(!n)return;state.stock[n]=Math.max(0,parseInt(e.target.value,10)||0);save();update()});
$('reset').addEventListener('click',()=>{state.stock={};save();build()});
// 素材名のポップアップ（PCはカーソル、スマホはタップ）
const tip=$('tip');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function showTip(el){const t=NOTE[el.dataset.tip];if(!t)return;
tip.innerHTML=t.map(s=>'<div>'+esc(s)+'</div>').join('');tip.style.display='block';
const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
const x=Math.min(Math.max(8,r.left),innerWidth-w-8);let y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);
tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.display='none'}
const tipEl=e=>e.target.closest&&e.target.closest('[data-tip]');
$('list').addEventListener('mouseover',e=>{const el=tipEl(e);if(el)showTip(el)});
$('list').addEventListener('mouseout',e=>{if(tipEl(e))hideTip()});
$('list').addEventListener('click',e=>{const el=tipEl(e);if(el)showTip(el)});
$('list').addEventListener('focusin',e=>{const el=tipEl(e);if(el)showTip(el)});
$('list').addEventListener('focusout',e=>{if(tipEl(e))hideTip()});
document.addEventListener('click',e=>{if(!tipEl(e))hideTip()});
addEventListener('scroll',hideTip,true);
function renderPlan(){
$('plan').innerHTML=state.plan.length?state.plan.map((e,i)=>'<span class="chip">'+e.part+'（'+(e.stage==='all'?'全工程':'工程'+e.stage)+'）<button type="button" data-rm="'+i+'" aria-label="'+e.part+'を外す">×</button></span>').join(''):'<span class="note">パーツが追加されていません。上で選んで「追加」を押してください。</span>'}
$('add').addEventListener('click',()=>{state.plan.push({part:state.part,stage:state.stage});save();renderPlan();build()});
$('plan').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;state.plan.splice(+b.dataset.rm,1);save();renderPlan();build()});
renderPlan();stageOpts();build();
</script>
</body>
</html>
